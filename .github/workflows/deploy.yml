# 部署 考试宝自用版（kaoshibao-lite）到 GitHub Pages
# 触发：push 到 main 且改动涉及 app/、tools/、.github/workflows/（含 docs 变更会跳过以省配额，可自行放宽）
# 产物：tools/build-single.mjs 生成的 dist/（PWA 站：index.html + manifest + sw.js + icons）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成 PWA 站（dist/）
        run: |
          node tools/make-icons.mjs
          node tools/build-single.mjs
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
